<section class="hero is-fullheight has-text-centered" id="hero"
  style="background-image: url('{{ site.heroimage | relative_url }}');">
  <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="{{ site.heroimage | relative_url }}">
    <source src="{{ site.hero-video | relative_url }}" type="video/mp4">
  </video>
  <div class="hero-video-overlay" aria-hidden="true"></div>

  <div class="hero-body">
    <div class="container">
      <h1 class="title has-text-white is-size-1 is-uppercase has-text-weight-bold">
        {{ site.title }}
      </h1>
      <h3 class="subtitle has-text-white-bis is-uppercase has-text-weight-medium is-marginless">
        {{ site.description }}
      </h3>
      <hr>
      <a href="{{ site.url }}{{ site.baseurl }}/#about"
        class="button is-white is-rounded is-outlined is-uppercase has-text-weight-normal">Read More</a>
    </div>
  </div>
</section>

<style>
  #hero {
    position: relative;
    overflow: hidden;
    background-color: #000;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
  }

  #hero::before {
    display: none;
  }

  #hero .hero-video,
  #hero .hero-video-overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #hero .hero-video {
    z-index: 0;
    object-fit: cover;
  }

  #hero .hero-video-overlay {
    z-index: 1;
    background: linear-gradient(0deg, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.42));
    pointer-events: none;
  }

  #hero .hero-body {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  @media (prefers-reduced-motion: reduce) {
    #hero .hero-video {
      display: none;
    }
  }
</style>
