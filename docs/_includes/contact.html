<section class="hero pigeon-team" id="contact">
  <div class="pigeon-team__inner">
    <div class="pigeon-team__intro">
      <div class="pigeon-team__logo-card">
        <img src="{{ '/assets/images/pigeon-forge-logo.png' | relative_url }}"
          alt="비둘기 공방 Pigeon Forge 로고" loading="lazy">
      </div>

      <div class="pigeon-team__copy">
        <h2>비둘기 공방</h2>
        <p class="pigeon-team__english">PIGEON FORGE</p>
        <p class="pigeon-team__lead">
          아이디어를 직접 플레이하며<br>
          하나씩 다듬어가는 게임 제작팀입니다.
        </p>
        <p class="pigeon-team__description">
          비둘기 공방은 아이디어를 실제 게임으로 구현하고,<br>
          직접 플레이하며 필요한 부분을 하나씩 손보는 과정을 중요하게 생각합니다.<br><br>
          친숙하고 가벼운 이름처럼 쉽게 다가가면서도,<br>
          플레이한 뒤에는 분명한 개성과 재미가 남는 게임을 만들고자 합니다.<br>
        </p>

        <div class="pigeon-team__links">
          {% if site.email %}
            <a class="pigeon-team__button pigeon-team__button--primary" href="mailto:{{ site.email }}">
              <i class="fas fa-envelope" aria-hidden="true"></i>
              <span>연락 이메일</span>
            </a>
            <a class="pigeon-team__email" href="mailto:{{ site.email }}">{{ site.email }}</a>
          {% endif %}
        </div>
      </div>
    </div>

    <figure class="pigeon-team__meeting">
      <img src="{{ '/assets/images/pigeon-forge-meeting.jpg' | relative_url }}"
        alt="함께 둘러앉아 게임을 기획하는 비둘기 공방 팀" loading="lazy">
      <figcaption>
        <strong>아이디어가 모이는 비둘기 공방의 작업 시간</strong>
      </figcaption>
    </figure>
  </div>
</section>
